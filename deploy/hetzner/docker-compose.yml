# Прод-стек Uniqum Sport на Hetzner (78.47.93.22).
# Разворачивается в ~/uniqum на сервере. Хостовый nginx (root) проксирует
# crm.uniqumsport.kg -> 127.0.0.1:8081 (контейнер web). См. README.md.
#
# Supabase (БД/Auth) и Tigris (файлы) — внешние, НЕ в этом compose.
name: uniqum

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend.env
    restart: unless-stopped
    expose:
      - "3001"          # только внутри docker-сети uniqum_default; наружу не публикуется
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ISUP 5.0 listen-сервис: терминалы Hikvision сами подключаются сюда
  # (исходящее соединение из LAN комплекса). События форвардит в backend
  # на /v1/hik/events. Нативные библиотеки SDK — linux/amd64.
  isup:
    build:
      context: ./isup-service
      dockerfile: Dockerfile
    env_file: ./isup.env
    restart: unless-stopped
    ports:
      - "7660:7660/tcp"       # регистрация терминалов (CMS listen)
      - "7660:7660/udp"
      - "7332:7332/tcp"       # приём событий (alarm listen)
      - "7332:7332/udp"
      - "8090:8080"           # /photos/<токен> — терминал качает фото лица по faceURL
                              # (8080 на хосте занят integrator-app);
                              # /enroll и /door защищены заголовком X-Internal-Key

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./web.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"   # хостовый nginx проксирует сюда
