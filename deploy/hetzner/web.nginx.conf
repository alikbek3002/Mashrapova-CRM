# nginx внутри контейнера web: раздаёт собранный фронт (PWA) и проксирует API
# на backend:3001. Один origin (crm.uniqumsport.kg) => без CORS-префлайтов.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка фото — до 6 МБ (лимит бэкенда 5 МБ + запас на multipart).
    client_max_body_size 6m;

    # --- API бэкенда ---
    # resolver + переменная: nginx резолвит "backend" на каждый запрос через
    # docker DNS, а не кэширует IP на старте — иначе после пересоздания
    # backend-контейнера (docker compose up --build backend) web отдаёт 502
    # до собственного рестарта.
    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://backend:3001;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # стрим файлов из /v1/uploads/file/* — без буферизации
        proxy_buffering off;
    }

    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_health http://backend:3001;
        proxy_pass $api_health;
        proxy_set_header Host $host;
    }

    # --- статика PWA ---
    # service worker и manifest не кэшируем агрессивно (workbox сам версионирует бандлы)
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # хэшированные ассеты — можно кэшировать надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-fallback: всё остальное отдаём index.html.
    # no-cache обязателен: без Cache-Control браузер кэширует index.html
    # эвристически (днями) — после деплоя клиенты сидят на старой оболочке
    # со старыми хешами бандлов, пока кэш сам не протухнет.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
