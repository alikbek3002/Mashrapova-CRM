project_id = "mashrapov-academy"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[studio]
enabled = true
port = 55423

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = true
template = "Академия Машрапова: ваш код {{ .Code }}"

[storage]
enabled = true
file_size_limit = "5MiB"

# Локально — свои порты (5542x), чтобы не конфликтовать с другими
# Supabase-проектами на стандартных 5432x.
[inbucket]
enabled = true
port = 55424

[analytics]
enabled = false

[edge_runtime]
enabled = false

[db.pooler]
enabled = false
port = 55429
